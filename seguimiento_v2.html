<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Acciones — EHS Tornquist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-50:#ECFDF5; --brand-100:#D1FAE5; --brand-600:#059669;
    --brand-700:#047857; --brand-800:#065F46;
    --bg:#F8FAFC; --bg2:#FFFFFF; --bg3:#F1F5F9;
    --border:#E2E8F0; --border-strong:#CBD5E1;
    --t1:#0F172A; --t2:#475569; --t3:#94A3B8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter Tight',system-ui,sans-serif;
    background:var(--bg); color:var(--t1); min-height:100vh;
    letter-spacing:-.01em;
  }
  .topbar {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 20px; border-bottom:1px solid var(--border);
    background:#fff; position:sticky; top:0; z-index:10;
  }
  .topbar a { font-size:13px; color:var(--t2); text-decoration:none; }
  .topbar a:hover { color:var(--t1); }
  .topbar-title { font-size:14px; font-weight:600; }
  .container { max-width:1400px; margin:0 auto; padding:20px 16px; }
  h1 { font-size:24px; font-weight:700; margin-bottom:4px; letter-spacing:-.02em; }
  .last-update { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--t3); margin-bottom:18px; }

  .kpis {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px; margin-bottom:18px;
  }
  .kpi {
    background:#fff; border:1px solid var(--border); border-radius:10px;
    padding:14px; text-align:center;
  }
  .kpi-label {
    font-size:10px; font-weight:600; text-transform:uppercase;
    letter-spacing:.04em; color:var(--t2); margin-bottom:4px;
  }
  .kpi-value { font-size:26px; font-weight:700; }
  .kpi.abiertas .kpi-value { color:#991B1B; }
  .kpi.proceso .kpi-value { color:#92400E; }
  .kpi.cerradas .kpi-value { color:#065F46; }
  .kpi.vencidas .kpi-value { color:#7F1D1D; }

  /* ── PANEL DE INTELIGENCIA (KPIs avanzados) ── */
  .panel-inteligencia {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:12px; margin-bottom:18px;
  }
  .panel-box {
    background:#fff; border:1px solid var(--border); border-radius:10px;
    padding:14px 16px;
  }
  .panel-box h3 {
    font-size:11px; font-weight:700; color:var(--t2); text-transform:uppercase;
    letter-spacing:.05em; margin-bottom:10px;
  }
  .matriz-crit {
    display:grid; grid-template-columns:auto repeat(2, 1fr); gap:4px 8px;
    font-size:12px; align-items:center;
  }
  .matriz-crit .mh {
    font-size:10px; color:var(--t3); font-weight:600; text-transform:uppercase;
    text-align:center;
  }
  .matriz-crit .ml {
    font-weight:600; padding:4px 0;
  }
  .matriz-crit .mv {
    text-align:center; font-weight:700; padding:6px 0; border-radius:6px;
  }
  .matriz-crit .cr-alta .ml { color:#991B1B; }
  .matriz-crit .cr-alta .mv { background:#FEE2E2; }
  .matriz-crit .cr-media .ml { color:#92400E; }
  .matriz-crit .cr-media .mv { background:#FEF3C7; }
  .matriz-crit .cr-baja .ml { color:#065F46; }
  .matriz-crit .cr-baja .mv { background:#D1FAE5; }

  .aging-bar {
    display:flex; gap:6px; font-size:12px;
  }
  .aging-cell {
    flex:1; padding:10px 8px; border-radius:8px; text-align:center;
  }
  .aging-cell .av { font-size:22px; font-weight:700; line-height:1; }
  .aging-cell .al { font-size:10px; margin-top:4px; opacity:.8; }
  .aging-7  { background:#FEF3C7; color:#92400E; }
  .aging-14 { background:#FED7AA; color:#9A3412; }
  .aging-21 { background:#FECACA; color:#7F1D1D; }

  .lista-top {
    font-size:12px; margin:0;
  }
  .lista-top-item {
    display:flex; justify-content:space-between; padding:5px 0;
    border-bottom:1px dashed var(--border);
  }
  .lista-top-item:last-child { border-bottom:none; }
  .lista-top-item .nom { color:var(--t1); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:70%; }
  .lista-top-item .cnt { font-weight:700; color:#991B1B; }

  .cumpl-bar {
    text-align:center; padding:8px 0;
  }
  .cumpl-num { font-size:36px; font-weight:800; color:var(--brand-700); line-height:1; }
  .cumpl-lbl { font-size:11px; color:var(--t2); margin-top:6px; }
  .cumpl-det { font-size:10px; color:var(--t3); margin-top:4px; font-family:'JetBrains Mono',monospace; }

  /* ── FILTROS ── */
  .filters {
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;
  }
  .filter-group {
    display:flex; align-items:center; gap:6px;
    background:#fff; border:1px solid var(--border); border-radius:8px;
    padding:6px 10px;
  }
  .filter-label { font-size:11px; color:var(--t2); font-weight:600; }
  .filter-group select, .filter-group input {
    border:none; background:transparent; font:inherit; font-size:13px;
    color:var(--t1); cursor:pointer; min-width:0;
  }
  .filter-group select:focus, .filter-group input:focus { outline:none; }
  .filter-group input[type="date"] { font-size:12px; padding:0; }
  .filter-group input[type="text"] { min-width:150px; cursor:text; }
  .btn-toggle {
    padding:6px 12px; border-radius:8px; border:1px solid var(--border);
    background:#fff; font-size:12px; font-weight:600; cursor:pointer;
    color:var(--t1);
  }
  .btn-toggle.active {
    background:#DC2626; color:#fff; border-color:#DC2626;
  }
  .btn-clear {
    padding:6px 10px; border-radius:8px; border:1px dashed var(--border);
    background:transparent; font-size:11px; color:var(--t3); cursor:pointer;
  }
  .btn-clear:hover { color:var(--t1); border-color:var(--t2); }

  /* ── KANBAN EN FILAS con sub-columnas por criticidad ── */
  .kanban-rows {
    display:flex; flex-direction:column; gap:16px;
  }

  .kanban-row {
    background:#F8FAFC; border:1px solid var(--border); border-radius:12px;
    padding:14px 16px;
  }
  .kanban-row.row-abiertas { border-left:5px solid #DC2626; }
  .kanban-row.row-proceso  { border-left:5px solid #F59E0B; }
  .kanban-row.row-cerradas { border-left:5px solid #10B981; }

  .kanban-row-header {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:12px; padding-bottom:10px; border-bottom:1px dashed var(--border);
  }
  .kanban-row-title {
    font-size:15px; font-weight:700; color:var(--t1);
    text-transform:uppercase; letter-spacing:.03em;
  }
  .kanban-row-count {
    background:#fff; padding:3px 12px; border-radius:999px;
    font-size:13px; font-weight:700; color:var(--t2);
    border:1px solid var(--border);
  }

  /* Grid interno por criticidad: Alta | Media | Baja */
  .kanban-row-grid {
    display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;
  }
  @media (max-width: 900px) {
    .kanban-row-grid { grid-template-columns:1fr; }
  }

  .kanban-crit-col {
    background:#fff; border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; min-height:120px;
  }
  .kanban-crit-col.crit-alta  { border-top:3px solid #DC2626; background:#FFF8F8; }
  .kanban-crit-col.crit-media { border-top:3px solid #F59E0B; background:#FFFCF5; }
  .kanban-crit-col.crit-baja  { border-top:3px solid #10B981; background:#F8FFFB; }

  .kanban-crit-header {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border);
  }
  .kanban-crit-label {
    font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:.06em;
  }
  .kanban-crit-label.l-alta  { color:#991B1B; }
  .kanban-crit-label.l-media { color:#92400E; }
  .kanban-crit-label.l-baja  { color:#065F46; }
  .kanban-crit-count {
    font-size:11px; font-weight:700; padding:1px 8px; border-radius:999px;
  }
  .kanban-crit-count.c-alta  { background:#FEE2E2; color:#991B1B; }
  .kanban-crit-count.c-media { background:#FEF3C7; color:#92400E; }
  .kanban-crit-count.c-baja  { background:#D1FAE5; color:#065F46; }

  .kanban-empty {
    font-size:11px; color:var(--t3); text-align:center; padding:18px 8px;
    font-style:italic;
  }

  /* Card mejorada con criticidad y aging */
  .action-card {
    background:#fff; border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; margin-bottom:8px;
    transition:box-shadow .15s;
  }
  .action-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .action-card.vencida { border-left:4px solid #DC2626; background:#FFFBFB; }
  .action-card.proxima { border-left:4px solid #F59E0B; }
  .action-card.cerrada { opacity:.7; }

  /* Badge de criticidad arriba a la izquierda */
  .crit-badge {
    display:inline-block; font-size:9px; font-weight:700; padding:2px 8px;
    border-radius:4px; text-transform:uppercase; letter-spacing:.05em;
    margin-right:6px;
  }
  .crit-badge.alta  { background:#FEE2E2; color:#991B1B; }
  .crit-badge.media { background:#FEF3C7; color:#92400E; }
  .crit-badge.baja  { background:#D1FAE5; color:#065F46; }
  .crit-badge.sin   { background:#F3F4F6; color:#6B7280; }

  /* Aging chip — días vencidos prominentes */
  .aging-chip {
    display:inline-block; font-size:10px; font-weight:700; padding:3px 8px;
    border-radius:6px; margin-left:4px;
  }
  .aging-chip.venc {
    background:#7F1D1D; color:#fff;
  }
  .aging-chip.hoy {
    background:#DC2626; color:#fff;
  }
  .aging-chip.cerca {
    background:#FEF3C7; color:#92400E;
  }
  .aging-chip.ok {
    background:#F1F5F9; color:var(--t2);
  }
  .action-header {
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:10px; margin-bottom:6px;
  }
  .action-title { font-size:14px; font-weight:600; flex:1; }
  .action-meta {
    font-size:11px; color:var(--t2); display:flex; gap:14px; flex-wrap:wrap;
    margin-top:6px;
  }
  .action-meta-item { display:inline-flex; align-items:center; gap:4px; }
  .action-meta code {
    font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--t2);
  }
  .badge {
    display:inline-block; padding:2px 8px; border-radius:999px;
    font-size:10px; font-weight:600; letter-spacing:.02em;
    text-transform:uppercase;
  }
  .badge.abierta { background:#FEE2E2; color:#991B1B; }
  .badge.proceso { background:#FEF3C7; color:#92400E; }
  .badge.cerrada { background:#D1FAE5; color:#065F46; }
  .badge.cancelada { background:#E5E7EB; color:#4B5563; }

  .action-buttons {
    display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;
  }
  .btn-sm {
    padding:5px 10px; border-radius:6px; border:1px solid var(--border);
    background:#fff; font:inherit; font-size:11px; font-weight:600;
    color:var(--t2); cursor:pointer; transition:all .1s;
  }
  .btn-sm:hover { border-color:var(--border-strong); color:var(--t1); }
  .btn-sm.primary {
    background:var(--brand-600); color:#fff; border-color:var(--brand-600);
  }
  .btn-sm.primary:hover { background:var(--brand-700); border-color:var(--brand-700); }

  .empty {
    text-align:center; padding:40px 20px; color:var(--t3); font-size:13px;
  }
  .spinner {
    width:36px; height:36px; border:3px solid var(--border);
    border-top-color:var(--brand-600); border-radius:50%;
    animation:spin .8s linear infinite; margin:40px auto;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Modal */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(15,23,42,.55);
    backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    z-index:9999; padding:16px;
    animation:fadeIn .15s;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .modal-box {
    background:#fff; border-radius:14px; padding:20px;
    width:100%; max-width:420px;
  }
  .modal-box h3 { font-size:16px; font-weight:700; margin-bottom:14px; }
  .modal-box label {
    display:block; font-size:11px; font-weight:600; color:var(--t2);
    margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;
  }
  .modal-box select, .modal-box input, .modal-box textarea {
    width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;
    font:inherit; font-size:13px; margin-bottom:14px;
  }
  .modal-box textarea { min-height:60px; resize:vertical; }
  .modal-btns {
    display:flex; gap:8px; justify-content:flex-end;
  }
  .modal-btn {
    padding:8px 14px; border-radius:8px; font:inherit; font-size:13px;
    font-weight:600; cursor:pointer; border:1px solid transparent;
  }
  .modal-btn-cancel { background:var(--bg3); color:var(--t2); border-color:var(--border); }
  .modal-btn-ok { background:var(--brand-600); color:#fff; }
  .modal-btn-ok:hover { background:var(--brand-700); }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html">← Inicio</a>
  <span class="topbar-title">Seguimiento de Acciones</span>
  <a href="dashboard_v2.html">Dashboard</a>
</div>

<div class="container" id="app">
  <div class="spinner"></div>
</div>

<script>
// =============================================
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMoQM2DkE0FNwWKQwfJNluPqc0pg2TKv6MQs0tYUFpRSb3fk8E6vxtePJ0SKs0mkY/exec";
// =============================================

var ACCIONES = [];
var EVENTOS = [];
var MAESTROS = { personal:[], responsables:[], sectores:[] };

var FILTERS = {
  responsable:"Todos",
  estado:"Todos",
  sector:"Todos",
  criticidad:"Todos",     // Alta / Media / Baja
  creador:"Todos",        // Quien reportó el evento de origen
  cerradaPor:"Todos",     // Quien cerró la acción
  tipoEvento:"Todos",     // OBSERVACION, INCIDENTE, etc.
  fechaCreDesde:"",       // Fecha creación >= esta
  fechaCreHasta:"",       // Fecha creación <= esta
  busqueda:"",            // Texto libre en descripción
  soloVencidas:false,     // Solo las vencidas
  soloMias:false
};

// Identidad cargada desde localStorage (compartida con dashboard)
var IDENTIDAD = { legajo: "", nombre: "" };
try {
  var saved = localStorage.getItem("ehs_identidad_v2");
  if (saved) {
    var parsed = JSON.parse(saved);
    IDENTIDAD.legajo = parsed.legajo || "";
    IDENTIDAD.nombre = parsed.nombre || "";
  }
} catch(e) {}

// Escapa HTML para prevenir XSS al inyectar texto del usuario en innerHTML
function escapeHTML(s) {
  if (s === null || s === undefined) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Normaliza un nombre de persona para deduplicación: mayúsculas, sin acentos,
// y ORDENA las palabras alfabéticamente para tolerar diferencias de orden
// (APELLIDO NOMBRE vs NOMBRE APELLIDO).
// "José Luis Vallejos" y "VALLEJOS JOSE LUIS" → ambos "JOSE LUIS VALLEJOS"
function normalizarNombrePersona(nombre) {
  if (!nombre) return "";
  var limpio = String(nombre)
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")  // Quitar acentos
    .toUpperCase()
    .replace(/\s+/g, " ")
    .trim();
  if (!limpio) return "";
  // Separar en palabras y ordenar alfabéticamente para tolerar orden distinto
  var palabras = limpio.split(" ").filter(function(p){ return p.length > 0; });
  palabras.sort();
  return palabras.join(" ");
}

// Elige la variante más "limpia" entre nombres equivalentes:
// prioriza la que tiene formato APELLIDO NOMBRE (más mayúsculas, sin minúsculas mezcladas)
function elegirVarianteCanonica(nombres) {
  // Heurística: tomar el primero que esté completamente en MAYÚSCULAS y sin caracteres acentuados raros
  for (var i = 0; i < nombres.length; i++) {
    var n = nombres[i];
    if (n === n.toUpperCase() && !/[a-z]/.test(n)) return n;
  }
  // Si ninguno está todo en mayúsculas, devolver el primero
  return nombres[0];
}

function loadData() {
  fetch(APPS_SCRIPT_URL + "?tipo=all")
    .then(function(r){ return r.json(); })
    .then(function(data){
      EVENTOS = data.eventos || [];
      ACCIONES = data.acciones || [];
      MAESTROS = data.maestros || MAESTROS;
      render();
    })
    .catch(function(err){
      document.getElementById("app").innerHTML =
        '<div class="empty">Error al cargar: '+err.message+
        '<br><br><button class="btn-sm primary" onclick="loadData()">Reintentar</button></div>';
    });
}

function getEventoOf(accion) {
  return EVENTOS.filter(function(e){return String(e.evento_id) === String(accion.evento_id)})[0] || {};
}

function applyFilters(acciones) {
  return acciones.filter(function(a){
    var ev = getEventoOf(a);

    // Filtros básicos (responsable comparado normalizado)
    if (FILTERS.responsable !== "Todos") {
      if (normalizarNombrePersona(a.responsable_nombre) !== normalizarNombrePersona(FILTERS.responsable)) return false;
    }
    if (FILTERS.estado !== "Todos" && a.estado !== FILTERS.estado) return false;
    if (FILTERS.sector !== "Todos" && ev.sector !== FILTERS.sector) return false;

    // Criticidad (viene del evento como ev.prioridad)
    if (FILTERS.criticidad !== "Todos") {
      var prio = String(ev.prioridad || "").trim();
      if (prio !== FILTERS.criticidad) return false;
    }

    // Tipo de evento de origen
    if (FILTERS.tipoEvento !== "Todos" && ev.tipo !== FILTERS.tipoEvento) return false;

    // Creador del evento de origen (normalizado)
    if (FILTERS.creador !== "Todos") {
      if (normalizarNombrePersona(ev.reportado_por_nombre) !== normalizarNombrePersona(FILTERS.creador)) return false;
    }

    // Cerrada por (normalizado)
    if (FILTERS.cerradaPor !== "Todos") {
      if (normalizarNombrePersona(a.cerrada_por_nombre) !== normalizarNombrePersona(FILTERS.cerradaPor)) return false;
    }

    // Rango de fechas de creación
    if (FILTERS.fechaCreDesde) {
      var fc = String(a.fecha_creacion || "").substring(0,10);
      if (!fc || fc < FILTERS.fechaCreDesde) return false;
    }
    if (FILTERS.fechaCreHasta) {
      var fc2 = String(a.fecha_creacion || "").substring(0,10);
      if (!fc2 || fc2 > FILTERS.fechaCreHasta) return false;
    }

    // Búsqueda libre (descripción de la acción o del evento)
    if (FILTERS.busqueda) {
      var q = FILTERS.busqueda.toLowerCase();
      var texto = (a.descripcion || "") + " " + (ev.descripcion || "") + " " + (a.responsable_nombre || "") + " " + (ev.reportado_por_nombre || "");
      if (texto.toLowerCase().indexOf(q) === -1) return false;
    }

    // Solo vencidas
    if (FILTERS.soloVencidas) {
      if (a.estado === "Cerrada" || a.estado === "Cancelada") return false;
      var d = diasAlVencimiento(a.fecha_vencimiento);
      if (d === null || d >= 0) return false;
    }

    // Solo mis acciones
    if (FILTERS.soloMias) {
      var legY = String(IDENTIDAD.legajo || "").trim();
      var nomY = String(IDENTIDAD.nombre || "").trim().toUpperCase();
      var legA = String(a.responsable_legajo || "").trim();
      var nomA = String(a.responsable_nombre || "").trim().toUpperCase();
      var coincide = (legY && legA && legY === legA) || (nomY && nomA && nomY === nomA);
      if (!coincide) return false;
    }
    return true;
  });
}

function clearFilters() {
  FILTERS.responsable = "Todos";
  FILTERS.estado = "Todos";
  FILTERS.sector = "Todos";
  FILTERS.criticidad = "Todos";
  FILTERS.creador = "Todos";
  FILTERS.cerradaPor = "Todos";
  FILTERS.tipoEvento = "Todos";
  FILTERS.fechaCreDesde = "";
  FILTERS.fechaCreHasta = "";
  FILTERS.busqueda = "";
  FILTERS.soloVencidas = false;
  // soloMias se conserva (es una preferencia del usuario)
  render();
}

function toggleVencidas() {
  FILTERS.soloVencidas = !FILTERS.soloVencidas;
  render();
}

function setBusqueda(v) {
  FILTERS.busqueda = v;
  render();
}

function setFechaCre(campo, valor) {
  FILTERS[campo] = valor;
  render();
}

function setFilter(key, value) {
  FILTERS[key] = value;
  render();
}

function toggleSoloMias() {
  FILTERS.soloMias = !FILTERS.soloMias;
  render();
}

function diasAlVencimiento(fechaVenc) {
  if (!fechaVenc) return null;
  // Forzar interpretación como hora local (evita off-by-one en zona ARG UTC-3)
  // "2026-04-26T00:00:00" se interpreta como 00:00 local, no UTC
  var vencStr = String(fechaVenc).substring(0,10);
  var venc = new Date(vencStr + "T00:00:00");
  var hoy = new Date();
  hoy.setHours(0,0,0,0);
  return Math.floor((venc - hoy) / (1000*60*60*24));
}

function render() {
  var filtered = applyFilters(ACCIONES);
  var html = '';

  html += '<h1>Seguimiento</h1>';
  html += '<div class="last-update">Última actualización: '+new Date().toLocaleString("es-AR")+' · '+ACCIONES.length+' acciones totales · '+filtered.length+' visibles</div>';

  // ── KPIs básicos ──
  var abiertas = ACCIONES.filter(function(a){return a.estado === "Abierta"}).length;
  var enProceso = ACCIONES.filter(function(a){return a.estado === "En proceso"}).length;
  var cerradas = ACCIONES.filter(function(a){return a.estado === "Cerrada"}).length;
  var vencidas = 0;
  ACCIONES.forEach(function(a){
    if (a.estado !== "Cerrada" && a.estado !== "Cancelada" && a.fecha_vencimiento) {
      var d = diasAlVencimiento(a.fecha_vencimiento);
      if (d !== null && d < 0) vencidas++;
    }
  });

  html += '<div class="kpis">';
  html += '<div class="kpi abiertas"><div class="kpi-label">Abiertas</div><div class="kpi-value">'+abiertas+'</div></div>';
  html += '<div class="kpi proceso"><div class="kpi-label">En proceso</div><div class="kpi-value">'+enProceso+'</div></div>';
  html += '<div class="kpi cerradas"><div class="kpi-label">Cerradas</div><div class="kpi-value">'+cerradas+'</div></div>';
  html += '<div class="kpi vencidas"><div class="kpi-label">Vencidas</div><div class="kpi-value">'+vencidas+'</div></div>';
  html += '</div>';

  // ── PANEL DE INTELIGENCIA ──
  html += renderPanelInteligencia(filtered);

  // ── FILTROS ──
  html += renderFiltros();

  html += '<h3 style="font-size:14px;font-weight:700;margin-bottom:10px;color:var(--t1);">Tablero ('+filtered.length+' acciones visibles)</h3>';

  // ── KANBAN ──
  if (filtered.length === 0) {
    html += '<div class="empty" style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:30px;text-align:center;color:var(--t2);">No hay acciones con estos filtros. <button class="btn-clear" onclick="clearFilters()" style="margin-left:10px;">Limpiar filtros</button></div>';
  } else {
    html += renderKanban(filtered);
  }

  document.getElementById("app").innerHTML = html;
}

// ─────────────────────────────────────────────────
// PANEL DE INTELIGENCIA — KPIs avanzados
// ─────────────────────────────────────────────────
function renderPanelInteligencia(acciones) {
  // 1. Matriz Criticidad × Estado
  var matriz = {
    alta: { pendientes:0, cerradas:0 },
    media: { pendientes:0, cerradas:0 },
    baja: { pendientes:0, cerradas:0 }
  };

  // 2. Aging buckets (días desde creación para no-cerradas)
  var aging = { ok7:0, dias14:0, dias21mas:0 };

  // 3. Top responsables con más vencidas
  var vencPorResp = {};
  // 4. Top sectores con más pendientes
  var pendPorSector = {};

  // 5. Cumplimiento (cerradas a tiempo / total cerradas con fecha)
  var cerradasATiempo = 0;
  var cerradasConFecha = 0;
  // Tiempo promedio de cierre por criticidad
  var tcierre = { alta:[], media:[], baja:[] };

  var hoy = new Date();
  hoy.setHours(0,0,0,0);

  acciones.forEach(function(a){
    var ev = getEventoOf(a);
    var crit = String(ev.prioridad || "").toLowerCase();
    var critKey = (crit === "alta" || crit === "media" || crit === "baja") ? crit : "media";

    var esCerrada = (a.estado === "Cerrada");
    var esCancelada = (a.estado === "Cancelada");

    // Matriz criticidad x estado (pendientes = abiertas + en proceso, cerradas = cerradas)
    if (esCerrada) matriz[critKey].cerradas++;
    else if (!esCancelada) matriz[critKey].pendientes++;

    // Aging para pendientes
    if (!esCerrada && !esCancelada && a.fecha_creacion) {
      var fc = new Date(String(a.fecha_creacion).substring(0,10) + "T00:00:00");
      var diasPend = Math.floor((hoy - fc) / (1000*60*60*24));
      if (diasPend <= 7) aging.ok7++;
      else if (diasPend <= 14) aging.dias14++;
      else aging.dias21mas++;
    }

    // Vencidas por responsable
    if (!esCerrada && !esCancelada && a.fecha_vencimiento) {
      var dv = diasAlVencimiento(a.fecha_vencimiento);
      if (dv !== null && dv < 0) {
        var resp = a.responsable_nombre || "Sin asignar";
        vencPorResp[resp] = (vencPorResp[resp] || 0) + 1;
      }
    }

    // Sectores con más pendientes
    if (!esCerrada && !esCancelada) {
      var sec = ev.sector || "Sin sector";
      pendPorSector[sec] = (pendPorSector[sec] || 0) + 1;
    }

    // Cumplimiento a tiempo
    if (esCerrada && a.fecha_vencimiento && a.fecha_cierre) {
      cerradasConFecha++;
      var fv = String(a.fecha_vencimiento).substring(0,10);
      var fc2 = String(a.fecha_cierre).substring(0,10);
      if (fc2 <= fv) cerradasATiempo++;
      // Tiempo promedio
      if (a.fecha_creacion) {
        var fcre = new Date(String(a.fecha_creacion).substring(0,10) + "T00:00:00");
        var fcie = new Date(fc2 + "T00:00:00");
        var dias = Math.floor((fcie - fcre) / (1000*60*60*24));
        if (dias >= 0) tcierre[critKey].push(dias);
      }
    }
  });

  function topN(obj, n) {
    return Object.keys(obj).map(function(k){ return {k:k, v:obj[k]}; })
      .sort(function(a,b){ return b.v - a.v; }).slice(0, n);
  }
  var topResp = topN(vencPorResp, 3);
  var topSec = topN(pendPorSector, 3);
  var pctCumpl = cerradasConFecha > 0 ? Math.round((cerradasATiempo / cerradasConFecha) * 100) : null;

  function avg(arr) {
    if (arr.length === 0) return null;
    return Math.round(arr.reduce(function(a,b){return a+b;}, 0) / arr.length);
  }

  var html = '<div class="panel-inteligencia">';

  // 1. Matriz Criticidad x Estado
  html += '<div class="panel-box">';
  html += '<h3>📊 Criticidad × estado</h3>';
  html += '<div class="matriz-crit">';
  html += '<div></div><div class="mh">Pendientes</div><div class="mh">Cerradas</div>';
  ["alta","media","baja"].forEach(function(c){
    var label = c.charAt(0).toUpperCase() + c.slice(1);
    html += '<div class="cr-'+c+' ml" style="grid-column:1;">'+label+'</div>';
    html += '<div class="cr-'+c+' mv">'+matriz[c].pendientes+'</div>';
    html += '<div class="cr-'+c+' mv">'+matriz[c].cerradas+'</div>';
  });
  html += '</div></div>';

  // 2. Aging — antigüedad de pendientes
  html += '<div class="panel-box">';
  html += '<h3>⏱ Antigüedad de pendientes</h3>';
  html += '<div class="aging-bar">';
  html += '<div class="aging-cell aging-7"><div class="av">'+aging.ok7+'</div><div class="al">≤ 7 días</div></div>';
  html += '<div class="aging-cell aging-14"><div class="av">'+aging.dias14+'</div><div class="al">8–14 días</div></div>';
  html += '<div class="aging-cell aging-21"><div class="av">'+aging.dias21mas+'</div><div class="al">+21 días</div></div>';
  html += '</div>';
  html += '<div style="font-size:10px;color:var(--t3);margin-top:8px;text-align:center;">Acciones acumuladas que llevan abiertas más tiempo del razonable</div>';
  html += '</div>';

  // 3. Cumplimiento + tiempo de cierre
  html += '<div class="panel-box">';
  html += '<h3>✓ Cumplimiento a tiempo</h3>';
  if (pctCumpl !== null) {
    html += '<div class="cumpl-bar">';
    html += '<div class="cumpl-num">'+pctCumpl+'%</div>';
    html += '<div class="cumpl-lbl">Cerradas dentro de plazo</div>';
    html += '<div class="cumpl-det">'+cerradasATiempo+' / '+cerradasConFecha+' acciones</div>';
    html += '</div>';
    // Tiempo promedio
    var tA = avg(tcierre.alta), tM = avg(tcierre.media), tB = avg(tcierre.baja);
    if (tA !== null || tM !== null || tB !== null) {
      html += '<div style="font-size:11px;color:var(--t2);border-top:1px dashed var(--border);padding-top:8px;margin-top:8px;">';
      html += '<div style="font-weight:600;color:var(--t1);margin-bottom:4px;">Tiempo promedio cierre:</div>';
      if (tA !== null) html += '<div>Alta: <strong>'+tA+'d</strong></div>';
      if (tM !== null) html += '<div>Media: <strong>'+tM+'d</strong></div>';
      if (tB !== null) html += '<div>Baja: <strong>'+tB+'d</strong></div>';
      html += '</div>';
    }
  } else {
    html += '<div style="font-size:12px;color:var(--t3);text-align:center;padding:20px 0;">Sin datos suficientes todavía</div>';
  }
  html += '</div>';

  // 4. Top 3 responsables con vencidas
  html += '<div class="panel-box">';
  html += '<h3>🚨 Top responsables con vencidas</h3>';
  if (topResp.length === 0) {
    html += '<div style="font-size:12px;color:#065F46;text-align:center;padding:20px 0;">✓ Sin acciones vencidas</div>';
  } else {
    html += '<div class="lista-top">';
    topResp.forEach(function(t){
      html += '<div class="lista-top-item">';
      html += '<span class="nom">'+escapeHTML(t.k)+'</span>';
      html += '<span class="cnt">'+t.v+'</span>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  // 5. Top 3 sectores con más pendientes
  html += '<div class="panel-box">';
  html += '<h3>🏭 Top sectores con pendientes</h3>';
  if (topSec.length === 0) {
    html += '<div style="font-size:12px;color:#065F46;text-align:center;padding:20px 0;">✓ Sin acciones pendientes</div>';
  } else {
    html += '<div class="lista-top">';
    topSec.forEach(function(t){
      html += '<div class="lista-top-item">';
      html += '<span class="nom">'+escapeHTML(t.k)+'</span>';
      html += '<span class="cnt" style="color:#92400E;">'+t.v+'</span>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  html += '</div>'; // /panel-inteligencia
  return html;
}

// ─────────────────────────────────────────────────
// FILTROS
// ─────────────────────────────────────────────────
function renderFiltros() {
  var html = '<div class="filters">';

  // Toggle "Solo mis acciones"
  if (IDENTIDAD.nombre) {
    var btnStyle = FILTERS.soloMias
      ? 'background:#10B981;color:#fff;border-color:#10B981;'
      : 'background:#fff;color:var(--t1);border-color:var(--border);';
    html += '<button onclick="toggleSoloMias()" class="btn-toggle" style="'+btnStyle+'">'
      + (FILTERS.soloMias ? '✓ ' : '👤 ')
      + 'Solo mis acciones</button>';
  }

  // Toggle "Solo vencidas"
  html += '<button onclick="toggleVencidas()" class="btn-toggle '+(FILTERS.soloVencidas?'active':'')+'">'
    + (FILTERS.soloVencidas ? '✓ ' : '⚠️ ')
    + 'Solo vencidas</button>';

  // Búsqueda libre
  html += '<div class="filter-group"><span class="filter-label">🔍</span>'
    + '<input type="text" placeholder="Buscar..." value="'+escapeHTML(FILTERS.busqueda)+'" oninput="setBusqueda(this.value)" /></div>';

  // Construir listas únicas con DEDUPE por nombre normalizado (sin acentos, sin mayús/minus)
  // Esto evita ver "Jose Luis Vallejos", "JOSE LUIS VALLEJOS", "José Luis vallejos" como 3 personas distintas.
  function dedupNombres(lista) {
    var grupos = {};
    lista.forEach(function(nombre) {
      if (!nombre) return;
      var key = normalizarNombrePersona(nombre);
      if (!key) return;
      if (!grupos[key]) grupos[key] = [];
      if (grupos[key].indexOf(nombre) === -1) grupos[key].push(nombre);
    });
    // Devolver una variante canónica por grupo
    var resultado = [];
    Object.keys(grupos).forEach(function(key) {
      resultado.push(elegirVarianteCanonica(grupos[key]));
    });
    return resultado.sort();
  }

  var responsablesCrudo = [], creadoresCrudo = [], cerradasPorCrudo = [];
  ACCIONES.forEach(function(a){
    if (a.responsable_nombre) responsablesCrudo.push(a.responsable_nombre);
    if (a.cerrada_por_nombre) cerradasPorCrudo.push(a.cerrada_por_nombre);
  });
  EVENTOS.forEach(function(e){
    if (e.reportado_por_nombre) creadoresCrudo.push(e.reportado_por_nombre);
  });

  var responsablesUnicos = ["Todos"].concat(dedupNombres(responsablesCrudo));
  var creadoresUnicos    = ["Todos"].concat(dedupNombres(creadoresCrudo));
  var cerradasPorUnicos  = ["Todos"].concat(dedupNombres(cerradasPorCrudo));

  html += filterSelect("criticidad","Criticidad",["Todos","Alta","Media","Baja"]);
  html += filterSelect("estado","Estado",["Todos","Abierta","En proceso","Cerrada","Cancelada"]);
  html += filterSelect("responsable","Responsable",responsablesUnicos);
  html += filterSelect("creador","Creador",creadoresUnicos);
  html += filterSelect("cerradaPor","Cerrada por",cerradasPorUnicos);
  html += filterSelect("sector","Sector",["Todos"].concat((MAESTROS.sectores||[]).map(function(s){return s.nombre;})));
  html += filterSelect("tipoEvento","Tipo evento",["Todos","OBSERVACION","CONVERSACION","INCIDENTE","ACCIDENTE","AMBIENTE"]);

  // Rango de fechas de creación
  html += '<div class="filter-group"><span class="filter-label">Creación desde:</span>'
    + '<input type="date" value="'+FILTERS.fechaCreDesde+'" onchange="setFechaCre(\'fechaCreDesde\',this.value)" /></div>';
  html += '<div class="filter-group"><span class="filter-label">hasta:</span>'
    + '<input type="date" value="'+FILTERS.fechaCreHasta+'" onchange="setFechaCre(\'fechaCreHasta\',this.value)" /></div>';

  // Identidad y limpiar
  if (IDENTIDAD.nombre) {
    html += '<div style="font-size:11px;color:var(--t2);align-self:center;">('+escapeHTML(IDENTIDAD.nombre)+')</div>';
  }
  html += '<button class="btn-clear" onclick="clearFilters()">✕ Limpiar filtros</button>';

  html += '</div>';

  // Tip si no hay identidad
  if (!IDENTIDAD.nombre) {
    html += '<div style="font-size:11px;color:var(--t2);padding:8px 12px;background:#FFFBEB;border:1px dashed #FDE68A;border-radius:8px;margin-bottom:12px;">💡 Tip: Elegí tu identidad en el Dashboard para filtrar tus acciones.</div>';
  }

  return html;
}

// ─────────────────────────────────────────────────
// KANBAN — 3 columnas: Abiertas | En proceso | Cerradas
// ─────────────────────────────────────────────────
function renderKanban(acciones) {
  // Agrupar por estado
  var grupos = { abiertas:[], proceso:[], cerradas:[] };
  acciones.forEach(function(a){
    if (a.estado === "Cerrada") grupos.cerradas.push(a);
    else if (a.estado === "En proceso") grupos.proceso.push(a);
    else if (a.estado === "Abierta") grupos.abiertas.push(a);
    // Canceladas no entran al kanban
  });

  // Determinar criticidad de una acción (desde el evento)
  function getCriticidad(a) {
    var ev = getEventoOf(a);
    var c = String(ev.prioridad || "").toLowerCase().trim();
    if (c === "alta" || c === "media" || c === "baja") return c;
    return "media"; // default si no hay criticidad
  }

  // Separar cada grupo en sub-grupos por criticidad
  function porCriticidad(arr) {
    return {
      alta: arr.filter(function(a){ return getCriticidad(a) === "alta"; }),
      media: arr.filter(function(a){ return getCriticidad(a) === "media"; }),
      baja: arr.filter(function(a){ return getCriticidad(a) === "baja"; })
    };
  }

  // Ordenar dentro de cada sub-grupo: pendientes por vencimiento (más vencidas arriba)
  // Cerradas por fecha de cierre descendente
  function ordenarPorVencimiento(arr) {
    return arr.slice().sort(function(a,b){
      var da = diasAlVencimiento(a.fecha_vencimiento);
      var db = diasAlVencimiento(b.fecha_vencimiento);
      if (da === null) return 1;
      if (db === null) return -1;
      return da - db;
    });
  }
  function ordenarPorCierre(arr) {
    return arr.slice().sort(function(a,b){
      return String(b.fecha_cierre||"").localeCompare(String(a.fecha_cierre||""));
    });
  }

  var html = '<div class="kanban-rows">';

  // Función helper para renderizar una fila completa (estado) con sus 3 sub-columnas por criticidad
  function renderFila(estado, titulo, emoji, claseFila, acciones, ordenadora) {
    var subg = porCriticidad(acciones);
    var html = '<div class="kanban-row '+claseFila+'">';

    // Header de la fila
    html += '<div class="kanban-row-header">';
    html += '<div class="kanban-row-title">'+emoji+' '+titulo+'</div>';
    html += '<div class="kanban-row-count">'+acciones.length+' acciones</div>';
    html += '</div>';

    // Si no hay nada en la fila, mensaje único
    if (acciones.length === 0) {
      html += '<div class="kanban-empty">Sin acciones en este estado</div>';
      html += '</div>';
      return html;
    }

    // Grid interno con 3 sub-columnas (alta / media / baja)
    html += '<div class="kanban-row-grid">';

    [
      { crit:"alta",  label:"🔴 Alta",  data: subg.alta },
      { crit:"media", label:"🟡 Media", data: subg.media },
      { crit:"baja",  label:"🟢 Baja",  data: subg.baja }
    ].forEach(function(col) {
      var ordenada = ordenadora(col.data);
      html += '<div class="kanban-crit-col crit-'+col.crit+'">';
      html += '<div class="kanban-crit-header">';
      html += '<span class="kanban-crit-label l-'+col.crit+'">'+col.label+'</span>';
      html += '<span class="kanban-crit-count c-'+col.crit+'">'+col.data.length+'</span>';
      html += '</div>';
      if (col.data.length === 0) {
        html += '<div class="kanban-empty">—</div>';
      } else {
        ordenada.forEach(function(a){ html += renderAccionCard(a); });
      }
      html += '</div>';
    });

    html += '</div>'; // /kanban-row-grid
    html += '</div>'; // /kanban-row
    return html;
  }

  // 3 filas: Abiertas | En proceso | Cerradas
  html += renderFila("abiertas", "Abiertas", "🔴", "row-abiertas", grupos.abiertas, ordenarPorVencimiento);
  html += renderFila("proceso", "En proceso", "🟡", "row-proceso", grupos.proceso, ordenarPorVencimiento);
  html += renderFila("cerradas", "Cerradas", "🟢", "row-cerradas", grupos.cerradas, ordenarPorCierre);

  html += '</div>'; // /kanban-rows
  return html;
}

function renderAccionCard(a) {
  var ev = getEventoOf(a);
  var diasV = diasAlVencimiento(a.fecha_vencimiento);
  var esCerrada = (a.estado === "Cerrada");
  var esCancelada = (a.estado === "Cancelada");

  // Clase de card según vencimiento
  var cardClass = "action-card";
  if (esCerrada) cardClass += " cerrada";
  else if (!esCancelada && diasV !== null && diasV < 0) cardClass += " vencida";
  else if (!esCancelada && diasV !== null && diasV <= 3) cardClass += " proxima";

  // Criticidad del evento de origen
  var critRaw = String(ev.prioridad || "").toLowerCase().trim();
  var critKey = (critRaw === "alta" || critRaw === "media" || critRaw === "baja") ? critRaw : "sin";
  var critLabel = critKey === "sin" ? "—" : critKey.charAt(0).toUpperCase()+critKey.slice(1);

  var html = '<div class="'+cardClass+'">';

  // Header: criticidad + aging chip + título + estado
  html += '<div style="margin-bottom:6px;">';
  html += '<span class="crit-badge '+critKey+'">'+critLabel+'</span>';

  // Aging chip prominente para no-cerradas
  if (!esCerrada && !esCancelada) {
    if (diasV !== null) {
      if (diasV < 0) {
        html += '<span class="aging-chip venc">⚠ Vencida hace '+(-diasV)+'d</span>';
      } else if (diasV === 0) {
        html += '<span class="aging-chip hoy">⏰ Vence HOY</span>';
      } else if (diasV <= 3) {
        html += '<span class="aging-chip cerca">⏳ Vence en '+diasV+'d</span>';
      } else {
        html += '<span class="aging-chip ok">en '+diasV+'d</span>';
      }
    }
  }
  html += '</div>';

  // Título
  html += '<div style="font-size:13px;font-weight:600;line-height:1.35;margin-bottom:6px;color:var(--t1);">'+escapeHTML(a.descripcion)+'</div>';

  // Meta compacta
  html += '<div style="font-size:11px;color:var(--t2);line-height:1.55;">';
  html += '<div>👤 '+escapeHTML(a.responsable_nombre||"Sin asignar")+'</div>';
  if (a.fecha_vencimiento) {
    html += '<div>📅 '+formatDate(a.fecha_vencimiento)+'</div>';
  }
  if (ev.evento_id) {
    html += '<div>🎯 <code style="font-family:JetBrains Mono,monospace;font-size:10px;">'+escapeHTML(ev.evento_id)+'</code>'
         + (ev.sector ? ' · '+escapeHTML(ev.sector) : '')+'</div>';
  }
  if (ev.reportado_por_nombre) {
    html += '<div style="color:var(--t3);font-size:10px;">Creado por: '+escapeHTML(ev.reportado_por_nombre)+'</div>';
  }
  html += '</div>';

  if (a.notas) {
    html += '<div style="margin-top:8px;font-size:11px;color:var(--t2);background:var(--bg3);padding:6px 10px;border-radius:6px;">'+escapeHTML(a.notas)+'</div>';
  }

  if (esCerrada && a.cerrada_por_nombre) {
    html += '<div style="margin-top:8px;font-size:11px;color:#065F46;">✓ Cerrada el '+formatDate(a.fecha_cierre)+' por '+escapeHTML(a.cerrada_por_nombre)+'</div>';
  }

  // Botones de acción
  if (!esCerrada && !esCancelada) {
    html += '<div class="action-buttons">';
    html += '<button class="btn-sm primary" onclick="abrirCierre(\''+a.accion_id+'\')">✓ Cerrar</button>';
    html += '<button class="btn-sm" onclick="abrirNota(\''+a.accion_id+'\')">📝 Nota</button>';
    html += '<button class="btn-sm" onclick="abrirReprogramar(\''+a.accion_id+'\')">📅 Reprogramar</button>';
    html += '<button class="btn-sm" onclick="abrirCambioResp(\''+a.accion_id+'\')">👤 Responsable</button>';
    if (ev.evento_id) {
      html += '<button class="btn-sm" onclick="abrirDetalleEvento(\''+escapeHTML(ev.evento_id)+'\')">👁 Ver evento</button>';
    }
    html += '</div>';
  } else if (ev.evento_id) {
    html += '<div class="action-buttons">';
    html += '<button class="btn-sm" onclick="abrirDetalleEvento(\''+escapeHTML(ev.evento_id)+'\')">👁 Ver evento</button>';
    html += '</div>';

  html += '</div>';
  return html;
}

function filterSelect(key, label, options) {
  var html = '<div class="filter-group"><span class="filter-label">'+label+':</span><select onchange="setFilter(\''+key+'\',this.value)">';
  options.forEach(function(o){
    html += '<option value="'+o+'"'+(FILTERS[key]===o?' selected':'')+'>'+o+'</option>';
  });
  html += '</select></div>';
  return html;
}

function formatDate(s) {
  if (!s) return "—";
  var str = String(s);
  if (str.length >= 10) {
    var parts = str.substring(0,10).split("-");
    if (parts.length === 3) return parts[2]+'/'+parts[1]+'/'+parts[0];
  }
  return str;
}

function getAccion(id) {
  return ACCIONES.filter(function(a){return String(a.accion_id) === String(id)})[0];
}

function abrirCierre(accionId) {
  var a = getAccion(accionId);
  if (!a) return;
  var html = '<div class="modal-overlay" id="modalOv" onclick="if(event.target.id===\'modalOv\')cerrarModal()">';
  html += '<div class="modal-box">';
  html += '<h3>✓ Cerrar acción</h3>';
  html += '<div style="font-size:12px;color:var(--t2);margin-bottom:14px;">'+escapeHTML(a.descripcion)+'</div>';
  html += '<label>¿Quién cierra?</label>';

  // Construir lista: responsables primero (con ★) + todo el personal
  // Filtrar duplicados por legajo o nombre
  var personas = [];
  var vistos = {};
  (MAESTROS.responsables||[]).forEach(function(r){
    if (r.nombre) {
      var key = (r.legajo || "n:"+(r.nombre||"").toUpperCase());
      if (!vistos[key]) {
        personas.push({legajo:r.legajo||"", nombre:r.nombre||"", esResp:true});
        vistos[key] = true;
      }
    }
  });
  (MAESTROS.personal||[]).forEach(function(p){
    if (p.nombre) {
      var key = (p.legajo || "n:"+(p.nombre||"").toUpperCase());
      if (!vistos[key]) {
        personas.push({legajo:p.legajo||"", nombre:p.nombre||"", esResp:false});
        vistos[key] = true;
      }
    }
  });

  // Input de búsqueda + select grande
  html += '<input type="text" id="cierreBuscar" placeholder="Buscar por nombre o legajo..." '
       +  'oninput="filtrarCierre(this.value)" '
       +  'style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;margin-bottom:6px;box-sizing:border-box;"/>';
  html += '<select id="cierreSelect" size="6" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;font-size:13px;box-sizing:border-box;">';
  html += '<option value="">— Seleccionar —</option>';
  personas.forEach(function(p){
    var label = (p.esResp?"★ ":"") + p.nombre + (p.legajo?" (#"+p.legajo+")":"");
    html += '<option value="'+escapeHTML(p.nombre)+'" data-nombre="'+escapeHTML(p.nombre)+'" data-legajo="'+escapeHTML(p.legajo)+'">'+escapeHTML(label)+'</option>';
  });
  html += '</select>';
  html += '<div style="font-size:11px;color:var(--t3);margin-top:4px;">★ = responsables · '+personas.length+' personas</div>';
  html += '<div class="modal-btns">';
  html += '<button class="modal-btn modal-btn-cancel" onclick="cerrarModal()">Cancelar</button>';
  html += '<button class="modal-btn modal-btn-ok" onclick="confirmarCierre(\''+accionId+'\')">Confirmar cierre</button>';
  html += '</div></div></div>';
  document.body.insertAdjacentHTML("beforeend",html);
}

// Filtro en vivo para el select de cierre
function filtrarCierre(query) {
  var sel = document.getElementById("cierreSelect");
  if (!sel) return;
  var q = String(query||"").toLowerCase().trim();
  for (var i=0; i<sel.options.length; i++) {
    var opt = sel.options[i];
    if (!opt.value) continue; // saltear "— Seleccionar —"
    var nombre = (opt.getAttribute("data-nombre")||"").toLowerCase();
    var legajo = (opt.getAttribute("data-legajo")||"").toLowerCase();
    var match = !q || nombre.indexOf(q) !== -1 || legajo.indexOf(q) !== -1;
    opt.style.display = match ? "" : "none";
  }
}
function confirmarCierre(accionId) {
  var sel = document.getElementById("cierreSelect");
  var opt = sel.options[sel.selectedIndex];
  var nombre = opt ? (opt.getAttribute("data-nombre") || sel.value) : sel.value;
  var legajo = opt ? (opt.getAttribute("data-legajo") || "") : "";
  if (!nombre) { alert("Seleccioná quién cierra"); return; }

  // Feedback visual: deshabilitar botón
  var btn = document.querySelector(".modal-btn-ok");
  if (btn) { btn.textContent = "Cerrando..."; btn.disabled = true; }

  var params = new URLSearchParams();
  params.append("action","actualizar_accion");
  params.append("accion_id", accionId);
  params.append("estado","Cerrada");
  params.append("cerrada_por_legajo", legajo || "");
  params.append("cerrada_por_nombre", nombre);

  fetch(APPS_SCRIPT_URL,{method:"POST",body:params})
    .then(function(r){ return r.json(); })
    .then(function(resp){
      if (!resp || resp.ok === false) {
        alert("❌ No se pudo cerrar la acción: " + (resp && resp.error ? resp.error : "respuesta inválida")
          + "\n\nEs posible que tu sesión haya expirado o que el sistema no encuentre la acción. Recargá la página (Ctrl+F5) y volvé a intentar.");
        if (btn) { btn.textContent = "Confirmar cierre"; btn.disabled = false; }
        return;
      }
      // Backend confirmó OK → actualizar estado local
      ACCIONES.forEach(function(a){
        if (a.accion_id === accionId) {
          a.estado = "Cerrada";
          a.cerrada_por_nombre = nombre;
          a.cerrada_por_legajo = legajo;
          a.fecha_cierre = new Date().toISOString();
        }
      });
      cerrarModal();
      render();
      // Recarga desde servidor para sincronizar con cualquier otro cambio
      setTimeout(loadData, 500);
    })
    .catch(function(err){
      alert("❌ Error de red al cerrar: " + err.message
        + "\n\nProbá de nuevo en unos segundos. Si el problema persiste, recargá la página.");
      if (btn) { btn.textContent = "Confirmar cierre"; btn.disabled = false; }
    });
}

// Abre un modal con el detalle del evento asociado a la acción
function abrirDetalleEvento(eventoId) {
  var ev = EVENTOS.filter(function(e){ return String(e.evento_id) === String(eventoId); })[0];
  if (!ev) { alert("No se encontró el evento " + eventoId); return; }

  var html = '<div class="modal-overlay" id="modalOv" onclick="if(event.target.id===\'modalOv\')cerrarModal()">';
  html += '<div class="modal-box" style="max-width:560px;">';
  html += '<h3>👁 Detalle del evento</h3>';

  // ID + tipo + subtipo
  html += '<div style="font-size:11px;color:var(--t2);margin-bottom:4px;">'+escapeHTML(ev.evento_id||"")+'</div>';
  html += '<div style="font-weight:700;font-size:15px;margin-bottom:14px;">'
       + escapeHTML(ev.tipo||"") + (ev.subtipo?' · '+escapeHTML(ev.subtipo):'') + '</div>';

  // Datos principales
  html += '<div style="display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;">';
  if (ev.fecha_evento)        html += detRow("Fecha", formatDate(ev.fecha_evento) + (ev.hora_evento?' '+ev.hora_evento:''));
  if (ev.sector)              html += detRow("Sector", ev.sector);
  if (ev.turno)               html += detRow("Turno", ev.turno);
  if (ev.reportado_por_nombre) html += detRow("Reportado por", ev.reportado_por_nombre + (ev.reportado_por_legajo?' (#'+ev.reportado_por_legajo+')':''));
  if (ev.prioridad)           html += detRow("Prioridad", ev.prioridad);
  if (ev.persona_nombre)      html += detRow("Persona involucrada", ev.persona_nombre);
  html += '</div>';

  // Descripción
  if (ev.descripcion) {
    html += '<div style="margin-top:14px;">';
    html += '<div style="font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:4px;">Descripción</div>';
    html += '<div style="font-size:13px;background:var(--bg3);padding:10px 12px;border-radius:6px;">'+escapeHTML(ev.descripcion)+'</div>';
    html += '</div>';
  }

  // Foto si existe
  if (ev.foto_url) {
    html += '<div style="margin-top:12px;text-align:center;">';
    html += '<div style="font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:6px;">📷 Foto</div>';
    html += '<a href="'+escapeHTML(ev.foto_url)+'" target="_blank" rel="noopener">';
    html += '<img src="'+escapeHTML(ev.foto_url)+'" style="max-width:100%;max-height:280px;border-radius:8px;border:1px solid var(--border);cursor:pointer;" alt="Foto del evento"/>';
    html += '</a></div>';
  }

  html += '<div class="modal-btns" style="margin-top:18px;">';
  html += '<button class="modal-btn modal-btn-ok" onclick="cerrarModal()">Cerrar</button>';
  html += '</div></div></div>';
  document.body.insertAdjacentHTML("beforeend", html);
}

function detRow(label, value) {
  return '<div style="color:var(--t2);font-weight:600;">'+escapeHTML(label)+':</div>'
       + '<div>'+escapeHTML(value)+'</div>';
}
