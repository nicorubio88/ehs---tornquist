<svg viewBox="0 0 1300 1550" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5C6B58"/></marker></defs><rect x="0" y="0" width="1300" height="1550" rx="0" ry="0" fill="#F7F9F4"/><rect x="0" y="0" width="1300" height="130" rx="0" ry="0" fill="#8A5A0A"/><text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#FFFFFFB0" text-anchor="start"><tspan x="40" dy="0">SISTEMA EHS · SEGURIDAD, HIGIENE Y MEDIO AMBIENTE</tspan></text><text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#fff" text-anchor="start"><tspan x="40" dy="0">Cómo funciona el sistema · Planta Tornquist</tspan></text><text x="1260" y="100" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#FFFFFFCC" text-anchor="end"><tspan x="1260" dy="0">Reportar es proteger</tspan></text><rect x="60" y="170" width="1180" height="74" rx="14" ry="14" fill="#FFFFFF" stroke="#D8E0CE" stroke-width="1.6"/><text x="78" y="200" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#20291F" text-anchor="start"><tspan x="78" dy="0">1. Viste algo, o pasó algo</tspan></text><text x="78" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12.8" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="78" dy="0">Alguien haciendo algo riesgoso, una condición insegura, un casi-accidente, una lesión, un derrame...</tspan></text><line x1="650.0" y1="244" x2="650.0" y2="282" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><polygon points="650.0,282 960.0,346.0 650.0,410 340.0,346.0" fill="#FDF0DC" stroke="#8A5A0A" stroke-width="2"/><text x="650.0" y="339.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#8A5A0A" text-anchor="middle"><tspan x="650.0" dy="0">2. ¿Qué tipo de evento es?</tspan></text><text x="650.0" y="361.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5C6B58" text-anchor="middle"><tspan x="650.0" dy="0">elegís uno de los cinco — y después el subtipo</tspan></text><path d="M 650.0 410 Q 172.4 400 172.4 448" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><path d="M 650.0 410 Q 411.20000000000005 400 411.20000000000005 448" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><line x1="650.0" y1="410" x2="650.0" y2="448" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><path d="M 650.0 410 Q 888.8000000000001 400 888.8000000000001 448" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><path d="M 650.0 410 Q 1127.6000000000001 400 1127.6000000000001 448" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><rect x="60.0" y="452" width="224.8" height="214" rx="16" ry="16" fill="#FFFFFF" stroke="#3E5C9A" stroke-width="2"/><rect x="72.0" y="467" width="200.8" height="25" rx="12.5" ry="12.5" fill="#3E5C9A"/><text x="172.4" y="483.24" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="172.4" dy="0">OBSERVACIÓN</tspan></text><text x="74.0" y="514" font-family="Arial, Helvetica, sans-serif" font-size="11.8" font-weight="600" fill="#20291F" text-anchor="start"><tspan x="74.0" dy="0">Viste un acto o una</tspan><tspan x="74.0" dy="15">condición insegura</tspan></text><text x="74.0" y="570" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="800" fill="#5C6B58" text-anchor="start"><tspan x="74.0" dy="0">SUBTIPOS</tspan></text><circle cx="78.0" cy="584" r="2.5" fill="#3E5C9A"/><text x="87.0" y="588" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="87.0" dy="0">Acto inseguro</tspan></text><circle cx="78.0" cy="599" r="2.5" fill="#3E5C9A"/><text x="87.0" y="603" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="87.0" dy="0">Condición insegura</tspan></text><rect x="298.8" y="452" width="224.8" height="214" rx="16" ry="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><rect x="310.8" y="467" width="200.8" height="25" rx="12.5" ry="12.5" fill="#0F766E"/><text x="411.20000000000005" y="483.24" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="411.20000000000005" dy="0">CONVERSACIÓN</tspan></text><text x="312.8" y="514" font-family="Arial, Helvetica, sans-serif" font-size="11.8" font-weight="600" fill="#20291F" text-anchor="start"><tspan x="312.8" dy="0">Hablaste con alguien</tspan><tspan x="312.8" dy="15">sobre seguridad</tspan></text><text x="312.8" y="570" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="800" fill="#5C6B58" text-anchor="start"><tspan x="312.8" dy="0">SUBTIPOS</tspan></text><circle cx="316.8" cy="584" r="2.5" fill="#0F766E"/><text x="325.8" y="588" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="325.8" dy="0">Refuerzo positivo</tspan></text><circle cx="316.8" cy="599" r="2.5" fill="#0F766E"/><text x="325.8" y="603" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="325.8" dy="0">Coaching correctivo</tspan></text><circle cx="316.8" cy="614" r="2.5" fill="#0F766E"/><text x="325.8" y="618" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="325.8" dy="0">Charla de seguridad</tspan></text><rect x="537.6" y="452" width="224.8" height="214" rx="16" ry="16" fill="#FFFFFF" stroke="#E8871A" stroke-width="2"/><rect x="549.6" y="467" width="200.8" height="25" rx="12.5" ry="12.5" fill="#E8871A"/><text x="650.0" y="483.24" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="650.0" dy="0">INCIDENTE</tspan></text><text x="551.6" y="514" font-family="Arial, Helvetica, sans-serif" font-size="11.8" font-weight="600" fill="#20291F" text-anchor="start"><tspan x="551.6" dy="0">Casi pasa algo, o hubo</tspan><tspan x="551.6" dy="15">daño material</tspan></text><text x="551.6" y="570" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="800" fill="#5C6B58" text-anchor="start"><tspan x="551.6" dy="0">SUBTIPOS</tspan></text><circle cx="555.6" cy="584" r="2.5" fill="#E8871A"/><text x="564.6" y="588" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="564.6" dy="0">Casi accidente</tspan></text><circle cx="555.6" cy="599" r="2.5" fill="#E8871A"/><text x="564.6" y="603" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="564.6" dy="0">Daño material</tspan></text><circle cx="555.6" cy="614" r="2.5" fill="#E8871A"/><text x="564.6" y="618" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="564.6" dy="0">Falla con riesgo</tspan></text><rect x="776.4000000000001" y="452" width="224.8" height="214" rx="16" ry="16" fill="#FFFFFF" stroke="#B8402A" stroke-width="2"/><rect x="788.4000000000001" y="467" width="200.8" height="25" rx="12.5" ry="12.5" fill="#B8402A"/><text x="888.8000000000001" y="483.24" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="888.8000000000001" dy="0">ACCIDENTE</tspan></text><text x="790.4000000000001" y="514" font-family="Arial, Helvetica, sans-serif" font-size="11.8" font-weight="600" fill="#20291F" text-anchor="start"><tspan x="790.4000000000001" dy="0">Una persona se lastimó</tspan></text><text x="790.4000000000001" y="570" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="800" fill="#5C6B58" text-anchor="start"><tspan x="790.4000000000001" dy="0">SUBTIPOS</tspan></text><circle cx="794.4000000000001" cy="584" r="2.5" fill="#B8402A"/><text x="803.4000000000001" y="588" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="803.4000000000001" dy="0">Leve sin baja</tspan></text><circle cx="794.4000000000001" cy="599" r="2.5" fill="#B8402A"/><text x="803.4000000000001" y="603" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="803.4000000000001" dy="0">Leve con baja</tspan></text><circle cx="794.4000000000001" cy="614" r="2.5" fill="#B8402A"/><text x="803.4000000000001" y="618" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="803.4000000000001" dy="0">Grave</tspan></text><circle cx="794.4000000000001" cy="629" r="2.5" fill="#B8402A"/><text x="803.4000000000001" y="633" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="803.4000000000001" dy="0">Fatal</tspan></text><rect x="1015.2" y="452" width="224.8" height="214" rx="16" ry="16" fill="#FFFFFF" stroke="#548235" stroke-width="2"/><rect x="1027.2" y="467" width="200.8" height="25" rx="12.5" ry="12.5" fill="#548235"/><text x="1127.6000000000001" y="483.24" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1127.6000000000001" dy="0">AMBIENTE</tspan></text><text x="1029.2" y="514" font-family="Arial, Helvetica, sans-serif" font-size="11.8" font-weight="600" fill="#20291F" text-anchor="start"><tspan x="1029.2" dy="0">Impacto o riesgo</tspan><tspan x="1029.2" dy="15">ambiental</tspan></text><text x="1029.2" y="570" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="800" fill="#5C6B58" text-anchor="start"><tspan x="1029.2" dy="0">SUBTIPOS</tspan></text><circle cx="1033.2" cy="584" r="2.5" fill="#548235"/><text x="1042.2" y="588" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="1042.2" dy="0">Derrame</tspan></text><circle cx="1033.2" cy="599" r="2.5" fill="#548235"/><text x="1042.2" y="603" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="1042.2" dy="0">Fuga gas/vapor</tspan></text><circle cx="1033.2" cy="614" r="2.5" fill="#548235"/><text x="1042.2" y="618" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="1042.2" dy="0">Emisión</tspan></text><circle cx="1033.2" cy="629" r="2.5" fill="#548235"/><text x="1042.2" y="633" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="1042.2" dy="0">Residuo</tspan></text><circle cx="1033.2" cy="644" r="2.5" fill="#548235"/><text x="1042.2" y="648" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="1042.2" dy="0">Ruido</tspan></text><path d="M 172.4 688 Q 172.4 718 644.0 718" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><path d="M 411.20000000000005 688 Q 411.20000000000005 718 647.0 718" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><line x1="650.0" y1="688" x2="650.0" y2="718" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><path d="M 888.8000000000001 688 Q 888.8000000000001 718 653.0 718" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><path d="M 1127.6000000000001 688 Q 1127.6000000000001 718 656.0 718" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><line x1="650.0" y1="718" x2="650.0" y2="754" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><rect x="60" y="754" width="1180" height="150" rx="14" ry="14" fill="#FFFFFF" stroke="#8A5A0A" stroke-width="1.6"/><circle cx="88" cy="782" r="15" fill="#8A5A0A"/><text x="88" y="787" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="88" dy="0">3</tspan></text><text x="112" y="784" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#20291F" text-anchor="start"><tspan x="112" dy="0">Cargás los datos</tspan></text><circle cx="90" cy="811" r="3" fill="#E8871A"/><text x="105" y="816" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#20291F" text-anchor="start"><tspan x="105" dy="0">Cuándo y dónde: fecha, hora, sector y turno</tspan></text><circle cx="90" cy="834" r="3" fill="#E8871A"/><text x="105" y="839" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#20291F" text-anchor="start"><tspan x="105" dy="0">Quién reporta (por legajo) y quién está involucrado</tspan></text><circle cx="90" cy="857" r="3" fill="#E8871A"/><text x="105" y="862" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#20291F" text-anchor="start"><tspan x="105" dy="0">Qué pasó: descripción, foto y prioridad</tspan></text><circle cx="90" cy="880" r="3" fill="#E8871A"/><text x="105" y="885" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#20291F" text-anchor="start"><tspan x="105" dy="0">Después, las preguntas propias del tipo que elegiste</tspan></text><line x1="650.0" y1="904" x2="650.0" y2="938" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><rect x="60" y="938" width="1180" height="88" rx="14" ry="14" fill="#FFFFFF" stroke="#8A5A0A" stroke-width="1.6"/><circle cx="88" cy="966" r="15" fill="#8A5A0A"/><text x="88" y="971" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="88" dy="0">4</tspan></text><text x="112" y="968" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#20291F" text-anchor="start"><tspan x="112" dy="0">Acciones correctivas</tspan></text><text x="112" y="992" font-family="Arial, Helvetica, sans-serif" font-size="12.8" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="112" dy="0">Cada evento puede generar una o varias acciones, con responsable y fecha.</tspan><tspan x="112" dy="17">Ahí es donde el reporte se convierte en algo que cambia la planta.</tspan></text><line x1="650.0" y1="1026" x2="650.0" y2="1060" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><rect x="60" y="1060" width="1180" height="88" rx="14" ry="14" fill="#FFFFFF" stroke="#8A5A0A" stroke-width="1.6"/><circle cx="88" cy="1088" r="15" fill="#8A5A0A"/><text x="88" y="1093" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="88" dy="0">5</tspan></text><text x="112" y="1090" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#20291F" text-anchor="start"><tspan x="112" dy="0">Seguimiento y dashboard</tspan></text><text x="112" y="1114" font-family="Arial, Helvetica, sans-serif" font-size="12.8" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="112" dy="0">Pendientes, vencidas y en término, filtradas por responsable y sector.</tspan><tspan x="112" dy="17">El dashboard muestra los KPIs y la pirámide de seguridad.</tspan></text><line x1="650.0" y1="1148" x2="650.0" y2="1184" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><rect x="60" y="1184" width="1180" height="96" rx="16" ry="16" fill="#E6ECFA" stroke="#C7D5F2" stroke-width="1.6"/><text x="88" y="1216" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="800" fill="#2E4470" text-anchor="start"><tspan x="88" dy="0">¿Cuándo pasa a Causa Raíz?</tspan></text><text x="88" y="1240" font-family="Arial, Helvetica, sans-serif" font-size="12.8" font-weight="400" fill="#2E4470" text-anchor="start"><tspan x="88" dy="0">Si fue un accidente, si el mismo evento se repite, o si la acción correctiva no alcanzó: hay una causa de fondo</tspan><tspan x="88" dy="17">que no se resuelve con una acción puntual. Ahí se abre un análisis en el sistema de Causa Raíz.</tspan></text><rect x="0" y="1310" width="1300" height="240" rx="0" ry="0" fill="#8A5A0A"/><text x="650.0" y="1350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="650.0" dy="0">Cada evento que cargamos es una oportunidad para que nadie más se lastime</tspan></text><text x="650.0" y="1378" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#FFFFFFB0" text-anchor="middle"><tspan x="650.0" dy="0">Planta Tornquist · Papelera del Sur — Grupo H. Koch · Seguridad, Higiene y Medio Ambiente</tspan></text></svg>